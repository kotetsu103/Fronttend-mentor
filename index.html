<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="NFT preview card component - Frontend Mentor">
    <meta name="keywords" content="NFT preview card component, Frontend Mentor">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    </link>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
    <title>NFT preview card component</title>
</head>

<body>
    <main class="main-container">
        <section class="nft-container">
            <div class="container-image">
                <div class="main-image"></div>
                <div class="color-image"></div>
            </div>
            <div class="container-title">
                <h1><a href="">Poisedon</a> </h1>
                <p>Alias el sushi es el dios del mar, perfeccionista en todo y mira mal a todos por eso lo rebane.</p>
            </div>
            <div class="container-details">
                <div class="pricing">
                    <div class="pricing-img"></div>
                    <div>
                        <p>1.98 m de altura</p>
                    </div>
                </div>
                <div class="timing">
                    <div class="timing-img"></div>
                    <div>
                        <p>13.800 millones de años</p>
                    </div>
                </div>
            </div>
            <hr class="container-line">
            <div class="author">
                <img src="images/d91fa8aac99add11e14667f0126c48fb.jpg" alt="Amen">
                <p>Creacion de <a href="/" class="author-name">Jose Franco</a></p>
            </div>
        </section>
    </main>

</html>
